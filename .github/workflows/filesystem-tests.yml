name: Filesystem regressions

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile the command interpreters and copy experiment
        run: |
          g++ -std=c++17 -Wall -Wextra -O2 -pthread Q1.cpp -o Q1
          g++ -std=c++17 -Wall -Wextra -O2 -pthread Q3.cpp -o Q3
          g++ -std=c++17 -Wall -Wextra -Wpedantic -O2 -pthread bounded_copy.cpp -o bounded_copy
      - name: Exercise disposable filesystem fixtures
        run: python3 -m unittest discover -s tests -v
